# PostgreSQL para desarrollo y pruebas. No es la topología de producción (docs/architecture/deployment.md).
name: facturador

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: facturador
      POSTGRES_PASSWORD: facturador
      POSTGRES_DB: facturador_dev
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U facturador -d facturador_test"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
