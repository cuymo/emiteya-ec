# Topología de producción de referencia (harden-deployment-proxy-and-recovery; ADR 0027;
# docs/architecture/deployment.md). Un solo host: nginx es el único servicio público; la interfaz, la
# API y PostgreSQL viven en una red interna sin salida a Internet. Variables obligatorias, siempre
# fuera del repositorio:
#   EMITEYA_ENV_FILE     archivo de entorno del operador (DATABASE_URL, BETTER_AUTH_SECRET y, en el
#                        primer arranque, INITIAL_USER_EMAIL e INITIAL_USER_PASSWORD);
#   EMITEYA_SECRETS_DIR  directorio con postgres_password, certificate_master_key,
#                        tls_certificate y tls_private_key;
#   PUBLIC_ORIGIN        origen HTTPS público (por ejemplo, https://facturas.ejemplo.test).
# Plantilla de valores: deploy/production.env.example.
name: ${EMITEYA_PROJECT:-emiteya}

x-app-hardening: &app-hardening
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  stop_grace_period: 30s
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-emiteya}
      POSTGRES_DB: ${POSTGRES_DB:-emiteya}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [app]
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 30
    stop_grace_period: 30s
    restart: unless-stopped

  # Un solo uso: aplica las migraciones y termina. El backend solo arranca si termina con 0.
  migrate:
    image: emiteya-migrate:${EMITEYA_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
      target: migrate
    env_file:
      - path: ${EMITEYA_ENV_FILE:?define EMITEYA_ENV_FILE}
    networks: [app]
    depends_on:
      postgres:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"

  backend:
    <<: *app-hardening
    image: emiteya-backend:${EMITEYA_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
      target: runtime
    env_file:
      - path: ${EMITEYA_ENV_FILE:?define EMITEYA_ENV_FILE}
    environment:
      NODE_ENV: production
      PORT: "4000"
      BETTER_AUTH_URL: ${PUBLIC_ORIGIN:?define PUBLIC_ORIGIN}
      # La dirección fija de nginx en la red app: la misma variable que su ipv4_address.
      TRUST_PROXY: ${PROXY_APP_IP:-172.29.247.10}
      DATA_EXPORT_DIRECTORY: /var/lib/facturador/exports
      CERTIFICATE_MASTER_KEY_FILE: /run/secrets/certificate_master_key
      SRI_TRANSMISSION_ENABLED: "0"
      # El correo nace apagado y sin conexión sin cifrado (add-email-delivery, design D7 y D12).
      EMAIL_DELIVERY_ENABLED: "0"
      EMAIL_ALLOW_PLAINTEXT_SMTP: "0"
    secrets: [certificate_master_key]
    volumes:
      - exports:/var/lib/facturador/exports
    read_only: true
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=0700
    networks: [app]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Vida del proceso, no preparación: una dependencia caída no reinicia el contenedor.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/health/live').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 24

  frontend:
    <<: *app-hardening
    image: emiteya-frontend:${EMITEYA_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      target: runtime
      args:
        API_INTERNAL_URL: ${API_INTERNAL_URL:-http://backend:4000}
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://backend:4000}
    read_only: true
    tmpfs:
      - /app/.next/cache:uid=1000,gid=1000,mode=0700
    networks: [app]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/iniciar-sesion').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 24

  proxy:
    image: nginx:1.30.5-alpine
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?define PUBLIC_ORIGIN}
      NGINX_API_UPSTREAM: ${NGINX_API_UPSTREAM:-backend:4000}
      NGINX_WEB_UPSTREAM: ${NGINX_WEB_UPSTREAM:-frontend:3000}
      NGINX_PROXY_READ_TIMEOUT: ${NGINX_PROXY_READ_TIMEOUT:-60s}
      NGINX_DOWNLOAD_READ_TIMEOUT: ${NGINX_DOWNLOAD_READ_TIMEOUT:-180s}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
    secrets: [tls_certificate, tls_private_key]
    ports:
      - "${EDGE_HTTPS_PORT:-443}:443"
      - "${EDGE_HTTP_PORT:-80}:80"
    networks:
      edge: {}
      app:
        ipv4_address: ${PROXY_APP_IP:-172.29.247.10}
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    cap_drop: [ALL]
    # Mínimo medido de la imagen oficial: los puertos 80 y 443, el cambio de usuario de los workers y
    # el propietario de sus directorios temporales.
    cap_add: [CHOWN, NET_BIND_SERVICE, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 30s
    restart: unless-stopped

networks:
  edge: {}
  # Interna: sin salida a Internet. Si la subred choca con una red del host, cambia APP_SUBNET,
  # APP_IP_RANGE y PROXY_APP_IP juntos; TRUST_PROXY sigue a PROXY_APP_IP.
  app:
    internal: true
    ipam:
      config:
        - subnet: ${APP_SUBNET:-172.29.247.0/24}
          ip_range: ${APP_IP_RANGE:-172.29.247.128/25}

volumes:
  postgres-data: {}
  exports: {}

secrets:
  postgres_password:
    file: ${EMITEYA_SECRETS_DIR:?define EMITEYA_SECRETS_DIR}/postgres_password
  certificate_master_key:
    file: ${EMITEYA_SECRETS_DIR:?define EMITEYA_SECRETS_DIR}/certificate_master_key
  tls_certificate:
    file: ${EMITEYA_SECRETS_DIR:?define EMITEYA_SECRETS_DIR}/tls_certificate
  tls_private_key:
    file: ${EMITEYA_SECRETS_DIR:?define EMITEYA_SECRETS_DIR}/tls_private_key
