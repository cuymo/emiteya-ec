# Verificación completa en cada push y pull request (design de bootstrap-application, D13).
name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    # Imagen fija para builds reproducibles; pasar a ubuntu-26.04 es un mantenimiento aparte
    # (docs/quality/technical-debt.md).
    runs-on: ubuntu-24.04
    # Mitigación temporal para runners lentos: el último job verde tardó 29 min 31 s y 30 minutos ya
    # no dejaban margen. No se sube más; se perfila la suite (docs/quality/technical-debt.md).
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: facturador
          POSTGRES_PASSWORD: facturador
          POSTGRES_DB: facturador_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U facturador -d facturador_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://facturador:facturador@127.0.0.1:5432/facturador_test
      DATABASE_URL_TEST: postgresql://facturador:facturador@127.0.0.1:5432/facturador_test
      # Valores solo de CI para el arranque de check:dev-start; no son credenciales reales.
      BETTER_AUTH_SECRET: ci-solo-para-verificacion-0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3000
      INITIAL_USER_EMAIL: admin@example.com
      INITIAL_USER_PASSWORD: ci-solo-para-verificacion
      NEXT_TELEMETRY_DISABLED: "1"
      CHECKPOINT_DISABLE: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          # La caché automática ejecuta pnpm antes de que Corepack lo active en el paso siguiente.
          package-manager-cache: false
      - name: Activar Corepack
        run: corepack enable
      - name: Instalar dependencias
        run: corepack pnpm install --frozen-lockfile
      - name: Generar el cliente de Prisma
        run: corepack pnpm --filter @facturador/backend db:generate
      - name: Aplicar migraciones a la base de pruebas
        run: corepack pnpm --filter @facturador/backend db:migrate:deploy
      - name: Verificar
        run: corepack pnpm verify
